[project]
name = "rst2csv"
version = "0.1.0"
description = "Convert ANSYS RST acceleration results to Workbench-compatible FaceAccel CSV files."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
rst = [
  "ansys-mapdl-reader",
]
exact = [
  "h5py",
]
test = [
  "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
